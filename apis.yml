aid: scorpion
name: Scorpion
description: >-
  Scorpion is an American marketing technology company that provides revenue-focused
  advertising, marketing, and software services to local and multi-location businesses
  in home services, legal, franchise, and healthcare verticals. Founded in 2001 by
  Rustin Kretz and headquartered in Salt Lake City, Utah (with major operations in
  Valencia, California), Scorpion pairs done-for-you digital advertising and SEO with
  its own AI-driven platform. In 2024 it launched RevenueMAX, an AI marketing platform
  built on Scorpion AI that aligns marketing spend, intake, and long-term revenue, and
  in 2025 it introduced Scorpion Convert, an AI intake-and-conversion product that
  automates response, scheduling, and voice/messaging engagement for missed leads.
  Scorpion is a services-and-platform provider; it does not publish a public developer
  API, developer portal, or SDKs.
